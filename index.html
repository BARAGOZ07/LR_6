
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор стоимости услуг</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
        }

        .calculator {
            max-width: 600px;
            margin: 0 auto;
            padding: 30px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            text-align: center;
            font-size: 26px;
        }

        .description {
            margin-bottom: 25px;
            text-align: center;
            color: #64748b;
        }

        .field {
            margin-bottom: 22px;
        }

        .field-title {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .radio-option {
            display: block;
            margin: 12px 0;
            cursor: pointer;
        }

        input[type="radio"],
        input[type="checkbox"] {
            margin-right: 8px;
            accent-color: #2563eb;
        }

        input[type="number"],
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 16px;
            background-color: #ffffff;
        }

        input:focus,
        select:focus {
            outline: 2px solid #93c5fd;
            outline-offset: 2px;
        }

        .checkbox-option {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .checkbox-option input {
            width: 18px;
            height: 18px;
        }

        .total {
            margin-top: 25px;
            padding: 20px;
            text-align: center;
            background-color: #eff6ff;
            border-radius: 8px;
        }

        .total-label {
            display: block;
            margin-bottom: 8px;
            color: #475569;
        }

        .total-price {
            font-size: 32px;
            font-weight: bold;
            color: #1d4ed8;
        }

        .details {
            margin-top: 10px;
            color: #475569;
            font-size: 14px;
        }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 480px) {
            .calculator {
                padding: 20px;
            }

            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <main class="calculator">
        <h1>Калькулятор стоимости услуг</h1>
        <p class="description">
            Рассчитайте стоимость компьютерных услуг
        </p>

        <form id="calculator-form">
            <div class="field">
                <label class="field-title" for="quantity">
                    Количество услуг:
                </label>
                <input
                    type="number"
                    id="quantity"
                    name="quantity"
                    min="1"
                    step="1"
                    value="1"
                    required
                >
            </div>

            <fieldset class="field">
                <legend class="field-title">Выберите тип услуги:</legend>

                <label class="radio-option">
                    <input
                        type="radio"
                        name="service"
                        value="os"
                        checked
                    >
                    Установка операционной системы — 1500 ₽
                </label>

                <label class="radio-option">
                    <input
                        type="radio"
                        name="service"
                        value="assembly"
                    >
                    Сборка компьютера — от 3000 ₽
                </label>

                <label class="radio-option">
                    <input
                        type="radio"
                        name="service"
                        value="cleaning"
                    >
                    Чистка компьютера — 1000 ₽
                </label>
            </fieldset>

            <div class="field" id="option-field" hidden>
                <label class="field-title" for="option">
                    Выберите вариант сборки:
                </label>
                <select id="option" name="option">
                    <option value="3000">Базовая сборка — 3000 ₽</option>
                    <option value="5000">Стандартная сборка — 5000 ₽</option>
                    <option value="8000">Профессиональная сборка — 8000 ₽</option>
                </select>
            </div>

            <div class="field" id="property-field" hidden>
                <span class="field-title">Дополнительная услуга:</span>
                <label class="checkbox-option" for="thermal-paste">
                    <input
                        type="checkbox"
                        id="thermal-paste"
                        name="thermalPaste"
                    >
                    Замена термопасты (+500 ₽)
                </label>
            </div>

            <div class="total" aria-live="polite">
                <span class="total-label">Итоговая стоимость:</span>
                <output
                    class="total-price"
                    id="total-price"
                    for="quantity option thermal-paste"
                >1500 ₽</output>
                <p class="details" id="price-details">
                    1 услуга × 1500 ₽
                </p>
            </div>
        </form>
    </main>

    <script>
        /*global document */

        "use strict";

        var form = document.getElementById("calculator-form");
        var quantityInput = document.getElementById("quantity");
        var optionField = document.getElementById("option-field");
        var optionSelect = document.getElementById("option");
        var propertyField = document.getElementById("property-field");
        var thermalPaste = document.getElementById("thermal-paste");
        var totalPrice = document.getElementById("total-price");
        var priceDetails = document.getElementById("price-details");

        var servicePrices = {
            os: 1500,
            assembly: 3000,
            cleaning: 1000
        };

        function updateCalculator() {
            var selectedService = form.querySelector(
                'input[name="service"]:checked'
            ).value;
            var quantity = Number(quantityInput.value);
            var unitPrice = servicePrices[selectedService];
            var total;

            optionField.hidden = selectedService !== "assembly";
            propertyField.hidden = selectedService !== "cleaning";

            if (selectedService === "assembly") {
                unitPrice = Number(optionSelect.value);
            }

            if (selectedService === "cleaning" && thermalPaste.checked) {
                unitPrice += 500;
            }

            if (!Number.isInteger(quantity) || quantity < 1) {
                totalPrice.textContent = "—";
                priceDetails.textContent =
                    "Введите целое число не меньше 1.";
                return;
            }

            total = quantity * unitPrice;

            totalPrice.textContent = total.toLocaleString("ru-RU") + " ₽";
            priceDetails.textContent =
                quantity + " × " +
                unitPrice.toLocaleString("ru-RU") + " ₽";
        }

        form.addEventListener("input", updateCalculator);
        form.addEventListener("change", updateCalculator);

        updateCalculator();
    </script>
</body>
</html>
