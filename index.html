
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10251d">
    <title>Калькулятор услуг</title>

    <style>
        :root {
            color-scheme: dark;
            --background: #0b1712;
            --surface: #12271e;
            --surface-light: #1a3528;
            --green: #75d6a0;
            --green-dark: #285b40;
            --text: #edf5ef;
            --muted: #a2b8a9;
            --border: #2b4937;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 40px 16px;
            background: var(--background);
            color: var(--text);
            font-family: Arial, sans-serif;
            line-height: 1.5;
        }

        .container {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 32px;
            text-align: center;
        }

        .logo {
            display: inline-block;
            margin-bottom: 12px;
            color: var(--green);
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(28px, 5vw, 42px);
            line-height: 1.2;
        }

        header p {
            margin: 0;
            color: var(--muted);
        }

        .panel {
            margin-bottom: 22px;
            padding: 24px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: var(--surface);
        }

        h2 {
            margin: 0 0 8px;
            font-size: 21px;
        }

        .section-description {
            margin: 0 0 20px;
            color: var(--muted);
            font-size: 14px;
        }

        .services {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .service-card {
            min-width: 0;
            padding: 18px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #142a20;
            transition: border-color 0.2s, background 0.2s;
        }

        .service-card:has(.service-select:checked) {
            border-color: var(--green);
            background: var(--surface-light);
        }

        .service-heading {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 12px;
        }

        .service-select {
            width: 19px;
            height: 19px;
            margin: 3px 0 0;
            flex-shrink: 0;
            accent-color: var(--green);
            cursor: pointer;
        }

        .service-name {
            display: block;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .service-price {
            margin-top: 5px;
            color: var(--green);
            font-size: 14px;
        }

        .field {
            margin-top: 16px;
        }

        .field label,
        .field-title {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
        }

        input[type="number"],
        select {
            width: 100%;
            min-height: 42px;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--background);
            color: var(--text);
            font: inherit;
        }

        input:focus-visible,
        select:focus-visible,
        button:focus-visible {
            outline: 2px solid var(--green);
            outline-offset: 3px;
        }

        .property-label {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            font-size: 14px;
            cursor: pointer;
        }

        .property-label input {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            margin: 1px 0 0;
            accent-color: var(--green);
        }

        .summary {
            position: sticky;
            bottom: 12px;
            padding: 24px;
            border: 1px solid #38684a;
            border-radius: 16px;
            background: #173526;
            box-shadow: 0 8px 30px rgb(0 0 0 / 25%);
        }

        .summary-title {
            margin: 0 0 6px;
            color: var(--muted);
            font-size: 14px;
        }

        .total {
            color: var(--green);
            font-size: clamp(30px, 5vw, 40px);
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .summary-list {
            margin: 16px 0 0;
            padding: 0;
            list-style: none;
        }

        .summary-list li {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding: 10px 0;
            border-top: 1px solid var(--border);
            font-size: 14px;
        }

        .summary-list li span:last-child {
            color: var(--green);
            text-align: right;
            white-space: nowrap;
        }

        .empty-message {
            margin: 16px 0 0;
            color: var(--muted);
            font-size: 14px;
        }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 600px) {
            body {
                padding: 28px 12px;
            }

            .services {
                grid-template-columns: 1fr;
            }

            .panel,
            .summary {
                padding: 18px;
            }

            .summary-list li {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <header>
            <span class="logo">GreenTech</span>
            <h1>Калькулятор услуг</h1>
            <p>Выберите необходимые услуги и рассчитайте стоимость</p>
        </header>

        <form id="calculator-form">
            <section class="panel" aria-labelledby="services-title">
                <h2 id="services-title">Выбор услуг</h2>
                <p class="section-description">
                    Можно выбрать одну или несколько услуг одновременно.
                </p>

                <div class="services">
                    <article class="service-card">
                        <div class="service-heading">
                            <input
                                class="service-select"
                                type="checkbox"
                                id="service-os"
                                name="service-os"
                            >
                            <div>
                                <label class="service-name" for="service-os">
                                    Установка ОС
                                </label>
                                <div class="service-price">1 500 ₽ / шт.</div>
                            </div>
                        </div>

                        <div class="field" id="os-fields" hidden>
                            <label for="os-quantity">Количество</label>
                            <input
                                type="number"
                                id="os-quantity"
                                min="1"
                                step="1"
                                value="1"
                                inputmode="numeric"
                            >
                        </div>
                    </article>

                    <article class="service-card">
                        <div class="service-heading">
                            <input
                                class="service-select"
                                type="checkbox"
                                id="service-assembly"
                                name="service-assembly"
                            >
                            <div>
                                <label
                                    class="service-name"
                                    for="service-assembly"
                                >
                                    Сборка компьютера
                                </label>
                                <div class="service-price">От 3 000 ₽ / шт.</div>
                            </div>
                        </div>

                        <div class="field" id="assembly-fields" hidden>
                            <label for="assembly-option">Тип сборки</label>
                            <select id="assembly-option">
                                <option value="3000">
                                    Базовая — 3 000 ₽
                                </option>
                                <option value="5000">
                                    Стандартная — 5 000 ₽
                                </option>
                                <option value="8000">
                                    Профессиональная — 8 000 ₽
                                </option>
                            </select>

                            <div class="field">
                                <label for="assembly-quantity">
                                    Количество
                                </label>
                                <input
                                    type="number"
                                    id="assembly-quantity"
                                    min="1"
                                    step="1"
                                    value="1"
                                    inputmode="numeric"
                                >
                            </div>
                        </div>
                    </article>

                    <article class="service-card">
                        <div class="service-heading">
                            <input
                                class="service-select"
                                type="checkbox"
                                id="service-cleaning"
                                name="service-cleaning"
                            >
                            <div>
                                <label
                                    class="service-name"
                                    for="service-cleaning"
                                >
                                    Чистка компьютера
                                </label>
                                <div class="service-price">1 000 ₽ / шт.</div>
                            </div>
                        </div>

                        <div class="field" id="cleaning-fields" hidden>
                            <label for="cleaning-quantity">Количество</label>
                            <input
                                type="number"
                                id="cleaning-quantity"
                                min="1"
                                step="1"
                                value="1"
                                inputmode="numeric"
                            >

                            <div class="field">
                                <span class="field-title">
                                    Дополнительная опция
                                </span>
                                <label
                                    class="property-label"
                                    for="thermal-paste"
                                >
                                    <input
                                        type="checkbox"
                                        id="thermal-paste"
                                    >
                                    <span>
                                        Замена термопасты (+500 ₽ за шт.)
                                    </span>
                                </label>
                            </div>
                        </div>
                    </article>
                </div>
            </section>

            <section class="summary" aria-labelledby="summary-title">
                <h2 id="summary-title">Ваш заказ</h2>
                <p class="summary-title">Общая стоимость</p>
                <output
                    class="total"
                    id="total-price"
                    aria-live="polite"
                    aria-atomic="true"
                >0 ₽</output>

                <ul class="summary-list" id="summary-list"></ul>

                <p class="empty-message" id="empty-message">
                    Вы пока не выбрали ни одной услуги.
                </p>
            </section>
        </form>
    </main>

    <script>
        /*global document */

        "use strict";

        var form = document.getElementById("calculator-form");
        var osCheckbox = document.getElementById("service-os");
        var assemblyCheckbox = document.getElementById(
            "service-assembly"
        );
        var cleaningCheckbox = document.getElementById(
            "service-cleaning"
        );

        var osFields = document.getElementById("os-fields");
        var assemblyFields = document.getElementById("assembly-fields");
        var cleaningFields = document.getElementById("cleaning-fields");

        var assemblyOption = document.getElementById("assembly-option");
        var thermalPaste = document.getElementById("thermal-paste");
        var totalPrice = document.getElementById("total-price");
        var summaryList = document.getElementById("summary-list");
        var emptyMessage = document.getElementById("empty-message");

        function formatPrice(price) {
            return price.toLocaleString("ru-RU") + " ₽";
        }

        function getQuantity(id) {
            var input = document.getElementById(id);
            var quantity = Number(input.value);

            if (
                !Number.isInteger(quantity) ||
                quantity < 1 ||
                input.value.trim() === ""
            ) {
                return null;
            }

            return quantity;
        }

        function updateCalculator() {
            var total = 0;
            var items = [];
            var quantity;
            var unitPrice;
            var lineTotal;

            osFields.hidden = !osCheckbox.checked;
            assemblyFields.hidden = !assemblyCheckbox.checked;
            cleaningFields.hidden = !cleaningCheckbox.checked;

            if (osCheckbox.checked) {
                quantity = getQuantity("os-quantity");

                if (quantity === null) {
                    totalPrice.textContent = "Проверьте количество";
                    summaryList.replaceChildren();
                    emptyMessage.hidden = true;
                    return;
                }

                unitPrice = 1500;
                lineTotal = quantity * unitPrice;
                total += lineTotal;

                items.push({
                    name: "Установка ОС",
                    price: lineTotal
                });
            }

            if (assemblyCheckbox.checked) {
                quantity = getQuantity("assembly-quantity");

                if (quantity === null) {
                    totalPrice.textContent = "Проверьте количество";
                    summaryList.replaceChildren();
                    emptyMessage.hidden = true;
                    return;
                }

                unitPrice = Number(assemblyOption.value);
                lineTotal = quantity * unitPrice;
                total += lineTotal;

                items.push({
                    name: "Сборка компьютера",
                    price: lineTotal
                });
            }

            if (cleaningCheckbox.checked) {
                quantity = getQuantity("cleaning-quantity");

                if (quantity === null) {
                    totalPrice.textContent = "Проверьте количество";
                    summaryList.replaceChildren();
                    emptyMessage.hidden = true;
                    return;
                }

                unitPrice = 1000;

                if (thermalPaste.checked) {
                    unitPrice += 500;
                }

                lineTotal = quantity * unitPrice;
                total += lineTotal;

                items.push({
                    name: thermalPaste.checked ?
                        "Чистка и замена термопасты" :
                        "Чистка компьютера",
                    price: lineTotal
                });
            }

            totalPrice.textContent = formatPrice(total);
            summaryList.replaceChildren();
            emptyMessage.hidden = items.length > 0;

            items.forEach(function (item) {
                var listItem = document.createElement("li");
                var name = document.createElement("span");
                var price = document.createElement("span");

                name.textContent = item.name;
                price.textContent = formatPrice(item.price);

                listItem.appendChild(name);
                listItem.appendChild(price);
                summaryList.appendChild(listItem);
            });
        }

        form.addEventListener("input", updateCalculator);
        form.addEventListener("change", updateCalculator);

        updateCalculator();
    </script>
</body>
</html>
